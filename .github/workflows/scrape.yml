name: Scrape internships

# Started by cron-job.org, which keeps the schedule and timezone.
# Weekdays scrape. Weekends only send the reminder, so nothing is scraped.
on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a test Telegram message and email"
        type: boolean
        default: false
      reminder:
        description: "Only send the weekend reminder to apply"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs edit seen_jobs.json at the same time.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  # About 10 seconds: no Python setup, no browser, no scraping.
  reminder:
    if: inputs.reminder
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Send reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          count=$(python3 -c "import json; s = json.load(open('data/seen_jobs.json')); print(sum(len(c.get('seen', {})) for c in s['companies'].values()))" 2>/dev/null || echo "Your")
          text=$(printf '☀️ Weekend reminder: time to apply to internships!\n%s open internships are on your list.' "$count")
          curl -fsS -m 15 --retry 3 -o /dev/null \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

  scrape:
    if: ${{ !inputs.reminder }}
    runs-on: ubuntu-latest
    # A safety cap, not reserved compute: only the real run time is billed.
    # A normal run takes about 3 minutes. Raise this as companies grow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FRIEND_EMAIL: ${{ secrets.FRIEND_EMAIL }}
        run: python scripts/scraper.py ${{ inputs.test_alert && '--test-alert' || '' }}

      # Runs even after a failed send, so delivered jobs aren't alerted twice.
      - name: Save seen jobs
        if: always() && !inputs.test_alert
        run: |
          # Nothing to save if the scraper didn't get far enough to write it.
          [ -f data/seen_jobs.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          # Pull first in case companies.json was pushed during this run.
          git diff --cached --quiet || (
            git commit -m "Update seen jobs" &&
            git pull --rebase origin main &&
            git push
          )

      # Only reached when the whole run succeeds. Healthchecks.io warns you
      # by email if these pings stop.
      - name: Report healthy run
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL" || echo "Ping failed"
          fi
